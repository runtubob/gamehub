openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification for GameHub PS Rental Management
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: users
  - name: units
  - name: products
  - name: productCategories
  - name: stockAdjustments
  - name: rentals
  - name: transactions
  - name: dashboard
  - name: rentalPackages
  - name: expenses
  - name: settings
  - name: reports
  - name: admin

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuthUser"
    post:
      operationId: createUser
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserBody"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"

  /users/{id}:
    put:
      operationId: updateUser
      tags: [users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
    delete:
      operationId: deleteUser
      tags: [users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /units:
    get:
      operationId: listUnits
      tags: [units]
      responses:
        "200":
          description: List of units
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Unit"
    post:
      operationId: createUnit
      tags: [units]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUnitBody"
      responses:
        "201":
          description: Unit created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"

  /units/{id}:
    get:
      operationId: getUnit
      tags: [units]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unit details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"
    put:
      operationId: updateUnit
      tags: [units]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUnitBody"
      responses:
        "200":
          description: Unit updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"
    delete:
      operationId: deleteUnit
      tags: [units]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unit deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /product-categories:
    get:
      operationId: listProductCategories
      tags: [productCategories]
      responses:
        "200":
          description: List of product categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductCategory"
    post:
      operationId: createProductCategory
      tags: [productCategories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductCategoryBody"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductCategory"

  /product-categories/{id}:
    delete:
      operationId: deleteProductCategory
      tags: [productCategories]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Category deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /products:
    get:
      operationId: listProducts
      tags: [products]
      parameters:
        - name: categoryId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductBody"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    put:
      operationId: updateProduct
      tags: [products]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductBody"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /stock-adjustments:
    get:
      operationId: listStockAdjustments
      tags: [stockAdjustments]
      parameters:
        - name: productId
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of stock adjustments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockAdjustment"
    post:
      operationId: createStockAdjustment
      tags: [stockAdjustments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStockAdjustmentBody"
      responses:
        "201":
          description: Stock adjusted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockAdjustment"

  /rental-packages:
    get:
      operationId: listRentalPackages
      tags: [rentalPackages]
      responses:
        "200":
          description: List of rental packages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RentalPackage"
    post:
      operationId: createRentalPackage
      tags: [rentalPackages]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRentalPackageBody"
      responses:
        "201":
          description: Package created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalPackage"

  /rental-packages/{id}:
    put:
      operationId: updateRentalPackage
      tags: [rentalPackages]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRentalPackageBody"
      responses:
        "200":
          description: Package updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalPackage"
    delete:
      operationId: deleteRentalPackage
      tags: [rentalPackages]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Package deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /rentals:
    get:
      operationId: listRentals
      tags: [rentals]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, completed]
        - name: date
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of rentals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rental"
    post:
      operationId: startRental
      tags: [rentals]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRentalBody"
      responses:
        "201":
          description: Rental started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rental"

  /rentals/active:
    get:
      operationId: listActiveRentals
      tags: [rentals]
      responses:
        "200":
          description: Active rentals with countdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActiveRental"

  /rentals/{id}/stop:
    post:
      operationId: stopRental
      tags: [rentals]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StopRentalBody"
      responses:
        "200":
          description: Rental stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rental"

  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      parameters:
        - name: date
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [rental, product]
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
    post:
      operationId: createTransaction
      tags: [transactions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransactionBody"
      responses:
        "201":
          description: Transaction recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /transactions/batch:
    post:
      operationId: createTransactionBatch
      tags: [transactions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransactionBatchBody"
      responses:
        "201":
          description: Transactions recorded
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

  /transactions/recent:
    get:
      operationId: listRecentTransactions
      tags: [transactions]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Recent transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

  /expenses:
    get:
      operationId: listExpenses
      tags: [expenses]
      parameters:
        - name: date
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Expense"
    post:
      operationId: createExpense
      tags: [expenses]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExpenseBody"
      responses:
        "201":
          description: Expense created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"

  /expenses/{id}:
    delete:
      operationId: deleteExpense
      tags: [expenses]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Expense deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      responses:
        "200":
          description: Shop settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopSettings"
    put:
      operationId: updateSettings
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsBody"
      responses:
        "200":
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopSettings"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /reports/financial:
    get:
      operationId: getFinancialReport
      tags: [reports]
      parameters:
        - name: period
          in: query
          required: true
          schema:
            type: string
            enum: [daily, weekly, monthly, 3month, 6month, yearly]
        - name: startDate
          in: query
          schema:
            type: string
        - name: endDate
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Financial report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialReport"

  /admin/reset-balance:
    post:
      operationId: resetBalance
      tags: [admin]
      responses:
        "200":
          description: Balance reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    LoginBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required: [username, password]

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/AuthUser"
      required: [token, user]

    AuthUser:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [admin, owner, karyawan]
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, username, name, role, active, createdAt]

    CreateUserBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [admin, owner, karyawan]
      required: [username, password, name, role]

    UpdateUserBody:
      type: object
      properties:
        name:
          type: string
        password:
          type: string
          nullable: true
        role:
          type: string
          enum: [admin, owner, karyawan]
        active:
          type: boolean

    Unit:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string
          enum: [available, occupied]
        hourlyRate:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, name, status, hourlyRate, createdAt]

    CreateUnitBody:
      type: object
      properties:
        name:
          type: string
        hourlyRate:
          type: integer
      required: [name, hourlyRate]

    UpdateUnitBody:
      type: object
      properties:
        name:
          type: string
        hourlyRate:
          type: integer
        status:
          type: string
          enum: [available, occupied]

    ProductCategory:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, name, createdAt]

    CreateProductCategoryBody:
      type: object
      properties:
        name:
          type: string
      required: [name]

    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        categoryId:
          type: integer
          nullable: true
        categoryName:
          type: string
          nullable: true
        price:
          type: integer
        costPrice:
          type: integer
        stock:
          type: integer
        unitLabel:
          type: string
        packSize:
          type: integer
          nullable: true
        packLabel:
          type: string
          nullable: true
        packPrice:
          type: integer
          nullable: true
        packCostPrice:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, name, price, costPrice, stock, unitLabel, createdAt]

    CreateProductBody:
      type: object
      properties:
        name:
          type: string
        categoryId:
          type: integer
          nullable: true
        price:
          type: integer
        costPrice:
          type: integer
        stock:
          type: integer
        unitLabel:
          type: string
        packSize:
          type: integer
          nullable: true
        packLabel:
          type: string
          nullable: true
        packPrice:
          type: integer
          nullable: true
        packCostPrice:
          type: integer
          nullable: true
      required: [name, price, stock]

    UpdateProductBody:
      type: object
      properties:
        name:
          type: string
        categoryId:
          type: integer
          nullable: true
        price:
          type: integer
        costPrice:
          type: integer
        stock:
          type: integer
        unitLabel:
          type: string
        packSize:
          type: integer
          nullable: true
        packLabel:
          type: string
          nullable: true
        packPrice:
          type: integer
          nullable: true
        packCostPrice:
          type: integer
          nullable: true

    StockAdjustment:
      type: object
      properties:
        id:
          type: integer
        productId:
          type: integer
        productName:
          type: string
        type:
          type: string
          enum: [add, reduce]
        quantity:
          type: integer
        reason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, productId, productName, type, quantity, createdAt]

    CreateStockAdjustmentBody:
      type: object
      properties:
        productId:
          type: integer
        type:
          type: string
          enum: [add, reduce]
        quantity:
          type: integer
        reason:
          type: string
          nullable: true
      required: [productId, type, quantity]

    RentalPackage:
      type: object
      properties:
        id:
          type: integer
        label:
          type: string
        durationMinutes:
          type: integer
        price:
          type: integer
        costPrice:
          type: integer
        sortOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, label, durationMinutes, price, costPrice, sortOrder, createdAt]

    CreateRentalPackageBody:
      type: object
      properties:
        label:
          type: string
        durationMinutes:
          type: integer
        price:
          type: integer
        costPrice:
          type: integer
        sortOrder:
          type: integer
      required: [label, durationMinutes, price]

    UpdateRentalPackageBody:
      type: object
      properties:
        label:
          type: string
        durationMinutes:
          type: integer
        price:
          type: integer
        costPrice:
          type: integer
        sortOrder:
          type: integer

    Rental:
      type: object
      properties:
        id:
          type: integer
        unitId:
          type: integer
        unitName:
          type: string
        customerName:
          type: string
        packageId:
          type: integer
          nullable: true
        packageLabel:
          type: string
          nullable: true
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
          nullable: true
        durationMinutes:
          type: integer
          nullable: true
        totalCost:
          type: integer
          nullable: true
        status:
          type: string
          enum: [active, completed]
        createdAt:
          type: string
          format: date-time
      required: [id, unitId, unitName, customerName, startTime, status, createdAt]

    ActiveRental:
      type: object
      properties:
        id:
          type: integer
        unitId:
          type: integer
        unitName:
          type: string
        customerName:
          type: string
        packageLabel:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        remainingSeconds:
          type: integer
        totalCost:
          type: integer
      required: [id, unitId, unitName, customerName, packageLabel, startTime, endTime, remainingSeconds, totalCost]

    StartRentalBody:
      type: object
      properties:
        unitId:
          type: integer
        packageId:
          type: integer
      required: [unitId, packageId]

    StopRentalBody:
      type: object
      properties:
        paymentMethod:
          type: string
          enum: [cash, qris]
      required: [paymentMethod]

    Transaction:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [rental, product]
        description:
          type: string
        amount:
          type: integer
        paymentMethod:
          type: string
          enum: [cash, qris]
        rentalId:
          type: integer
          nullable: true
        productId:
          type: integer
          nullable: true
        quantity:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, type, description, amount, paymentMethod, createdAt]

    CreateTransactionBody:
      type: object
      properties:
        productId:
          type: integer
        quantity:
          type: integer
          default: 1
        isPack:
          type: boolean
        paymentMethod:
          type: string
          enum: [cash, qris]
      required: [productId, paymentMethod]

    CreateTransactionBatchBody:
      type: object
      properties:
        paymentMethod:
          type: string
          enum: [cash, qris]
        items:
          type: array
          items:
            type: object
            properties:
              productId:
                type: integer
              quantity:
                type: integer
              isPack:
                type: boolean
            required: [productId, quantity]
      required: [paymentMethod, items]

    Expense:
      type: object
      properties:
        id:
          type: integer
        description:
          type: string
        amount:
          type: integer
        paymentMethod:
          type: string
