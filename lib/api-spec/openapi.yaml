openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification for GameHub PS Rental Management
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: units
  - name: products
  - name: rentals
  - name: transactions
  - name: dashboard
  - name: rentalPackages
  - name: expenses
  - name: settings

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /units:
    get:
      operationId: listUnits
      tags: [units]
      summary: List all PlayStation units
      responses:
        "200":
          description: List of units
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Unit"
    post:
      operationId: createUnit
      tags: [units]
      summary: Add a new PlayStation unit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUnitBody"
      responses:
        "201":
          description: Unit created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"

  /units/{id}:
    get:
      operationId: getUnit
      tags: [units]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unit details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"
    put:
      operationId: updateUnit
      tags: [units]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUnitBody"
      responses:
        "200":
          description: Unit updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"
    delete:
      operationId: deleteUnit
      tags: [units]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unit deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /products:
    get:
      operationId: listProducts
      tags: [products]
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductBody"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    put:
      operationId: updateProduct
      tags: [products]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductBody"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /rental-packages:
    get:
      operationId: listRentalPackages
      tags: [rentalPackages]
      summary: List all rental packages
      responses:
        "200":
          description: List of rental packages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RentalPackage"
    post:
      operationId: createRentalPackage
      tags: [rentalPackages]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRentalPackageBody"
      responses:
        "201":
          description: Package created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalPackage"

  /rental-packages/{id}:
    put:
      operationId: updateRentalPackage
      tags: [rentalPackages]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRentalPackageBody"
      responses:
        "200":
          description: Package updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalPackage"
    delete:
      operationId: deleteRentalPackage
      tags: [rentalPackages]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Package deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /rentals:
    get:
      operationId: listRentals
      tags: [rentals]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, completed]
        - name: date
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of rentals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rental"
    post:
      operationId: startRental
      tags: [rentals]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRentalBody"
      responses:
        "201":
          description: Rental started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rental"

  /rentals/active:
    get:
      operationId: listActiveRentals
      tags: [rentals]
      responses:
        "200":
          description: Active rentals with countdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActiveRental"

  /rentals/{id}/stop:
    post:
      operationId: stopRental
      tags: [rentals]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StopRentalBody"
      responses:
        "200":
          description: Rental stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rental"

  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      parameters:
        - name: date
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [rental, product]
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
    post:
      operationId: createTransaction
      tags: [transactions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransactionBody"
      responses:
        "201":
          description: Transaction recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /transactions/batch:
    post:
      operationId: createTransactionBatch
      tags: [transactions]
      summary: Record multiple product sale transactions at once (cart checkout)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransactionBatchBody"
      responses:
        "201":
          description: Transactions recorded
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

  /transactions/recent:
    get:
      operationId: listRecentTransactions
      tags: [transactions]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Recent transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

  /expenses:
    get:
      operationId: listExpenses
      tags: [expenses]
      parameters:
        - name: date
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Expense"
    post:
      operationId: createExpense
      tags: [expenses]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExpenseBody"
      responses:
        "201":
          description: Expense created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"

  /expenses/{id}:
    delete:
      operationId: deleteExpense
      tags: [expenses]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Expense deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get shop settings
      responses:
        "200":
          description: Shop settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopSettings"
    put:
      operationId: updateSettings
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsBody"
      responses:
        "200":
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopSettings"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Unit:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string
          enum: [available, occupied]
        hourlyRate:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, name, status, hourlyRate, createdAt]

    CreateUnitBody:
      type: object
      properties:
        name:
          type: string
        hourlyRate:
          type: integer
      required: [name, hourlyRate]

    UpdateUnitBody:
      type: object
      properties:
        name:
          type: string
        hourlyRate:
          type: integer
        status:
          type: string
          enum: [available, occupied]

    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        price:
          type: integer
        costPrice:
          type: integer
        stock:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, name, price, costPrice, stock, createdAt]

    CreateProductBody:
      type: object
      properties:
        name:
          type: string
        price:
          type: integer
        costPrice:
          type: integer
        stock:
          type: integer
      required: [name, price, stock]

    UpdateProductBody:
      type: object
      properties:
        name:
          type: string
        price:
          type: integer
        costPrice:
          type: integer
        stock:
          type: integer

    RentalPackage:
      type: object
      properties:
        id:
          type: integer
        label:
          type: string
        durationMinutes:
          type: integer
        price:
          type: integer
        costPrice:
          type: integer
        sortOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, label, durationMinutes, price, costPrice, sortOrder, createdAt]

    CreateRentalPackageBody:
      type: object
      properties:
        label:
          type: string
        durationMinutes:
          type: integer
        price:
          type: integer
        costPrice:
          type: integer
        sortOrder:
          type: integer
      required: [label, durationMinutes, price]

    UpdateRentalPackageBody:
      type: object
      properties:
        label:
          type: string
        durationMinutes:
          type: integer
        price:
          type: integer
        costPrice:
          type: integer
        sortOrder:
          type: integer

    Rental:
      type: object
      properties:
        id:
          type: integer
        unitId:
          type: integer
        unitName:
          type: string
        customerName:
          type: string
        packageId:
          type: integer
          nullable: true
        packageLabel:
          type: string
          nullable: true
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
          nullable: true
        durationMinutes:
          type: integer
          nullable: true
        totalCost:
          type: integer
          nullable: true
        status:
          type: string
          enum: [active, completed]
        createdAt:
          type: string
          format: date-time
      required: [id, unitId, unitName, customerName, startTime, status, createdAt]

    ActiveRental:
      type: object
      properties:
        id:
          type: integer
        unitId:
          type: integer
        unitName:
          type: string
        customerName:
          type: string
        packageLabel:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        remainingSeconds:
          type: integer
        totalCost:
          type: integer
      required: [id, unitId, unitName, customerName, packageLabel, startTime, endTime, remainingSeconds, totalCost]

    StartRentalBody:
      type: object
      properties:
        unitId:
          type: integer
        customerName:
          type: string
        packageId:
          type: integer
      required: [unitId, customerName, packageId]

    StopRentalBody:
      type: object
      properties:
        paymentMethod:
          type: string
          enum: [cash, qris]
      required: [paymentMethod]

    Transaction:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [rental, product]
        description:
          type: string
        amount:
          type: integer
        paymentMethod:
          type: string
          enum: [cash, qris]
        rentalId:
          type: integer
          nullable: true
        productId:
          type: integer
          nullable: true
        quantity:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, type, description, amount, paymentMethod, createdAt]

    CreateTransactionBody:
      type: object
      properties:
        productId:
          type: integer
        quantity:
          type: integer
          default: 1
        paymentMethod:
          type: string
          enum: [cash, qris]
      required: [productId, paymentMethod]

    CreateTransactionBatchBody:
      type: object
      properties:
        paymentMethod:
          type: string
          enum: [cash, qris]
        items:
          type: array
          items:
            type: object
            properties:
              productId:
                type: integer
              quantity:
                type: integer
            required: [productId, quantity]
      required: [paymentMethod, items]

    Expense:
      type: object
      properties:
        id:
          type: integer
        description:
          type: string
        amount:
          type: integer
        paymentMethod:
          type: string
          enum: [cash, qris]
        createdAt:
          type: string
          format: date-time
      required: [id, description, amount, paymentMethod, createdAt]

    CreateExpenseBody:
      type: object
      properties:
        description:
          type: string
        amount:
          type: integer
        paymentMethod:
          type: string
          enum: [cash, qris]
      required: [description, amount, paymentMethod]

    ShopSettings:
      type: object
      properties:
        id:
          type: integer
        shopName:
          type: string
        tagline:
          type: string
      required: [id, shopName, tagline]

    UpdateSettingsBody:
      type: object
      properties:
        shopName:
          type: string
        tagline:
          type: string

    DashboardStats:
      type: object
      properties:
        todayIncome:
          type: integer
        todayProfit:
          type: integer
        cashIncome:
          type: integer
        qrisIncome:
          type: integer
        todayExpenses:
          type: integer
        cashExpenses:
          type: integer
        qrisExpenses:
          type: integer
        activeRentals:
          type: integer
        availableUnits:
          type: integer
        totalUnits:
          type: integer
        totalProducts:
          type: integer
        todayTransactions:
          type: integer
        weeklyIncome:
          type: array
          items:
            $ref: "#/components/schemas/DailyIncome"
      required:
        - todayIncome
        - todayProfit
        - cashIncome
        - qrisIncome
        - todayExpenses
        - cashExpenses
        - qrisExpenses
        - activeRentals
        - availableUnits
        - totalUnits
        - totalProducts
        - todayTransactions
        - weeklyIncome

    DailyIncome:
      type: object
      properties:
        date:
          type: string
        income:
          type: integer
      required: [date, income]

    DeleteResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required: [success, message]
